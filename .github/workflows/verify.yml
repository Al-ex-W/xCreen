name: Verify
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: macos-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python3 -m pip install -r bridge/requirements.txt
      - run: python3 -m unittest discover -s bridge/tests -v
      - run: swift test
      - run: bash scripts/build-app.sh
