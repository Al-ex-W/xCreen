name: Verify
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      # Hosted images default to an older Xcode; use the newest installed one.
      - name: Select newest Xcode
        run: |
          newest="$(ls -d /Applications/Xcode_*.app | sort -V | tail -1)"
          sudo xcode-select -s "$newest/Contents/Developer"
          xcodebuild -version
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Check llms.txt and site copies are up to date
        run: python3 scripts/build-llms.py --check
      - run: python3 -m pip install -r bridge/requirements.txt
      - run: python3 -m unittest discover -s bridge/tests -v
      # Installed-Hermes integration tests skip cleanly: XCREEN_HERMES_ROOT is not set on CI.
      - run: python3 -m unittest discover -s runtime/tests -v
      - run: python3 -m unittest discover -s Tests -p '*_test.py' -v
      - run: swift test
      - run: bash scripts/build-app.sh
