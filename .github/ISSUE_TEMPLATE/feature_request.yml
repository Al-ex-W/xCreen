name: Feature request
description: Suggest an improvement to xCreen.
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Issues are public. Please don't include screenshots, OCR/screen text or note contents. Describe examples in your own words.
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What are you trying to do, and what gets in the way today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: How should it work from the user's point of view (tray, CLI, Daily notes)?
    validations:
      required: true
  - type: textarea
    id: privacy
    attributes:
      label: Privacy impact
      description: Does this capture, store or send anything new, or change Integrity, exclusions or retention? If so, how should the user control it?
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
  - type: input
    id: macos
    attributes:
      label: macOS version (if relevant)
      placeholder: "e.g. 26.1"
