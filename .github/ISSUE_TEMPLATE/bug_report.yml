name: Bug report
description: Something in xCreen doesn't work as documented.
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        **Do not paste screenshots, OCR text, Daily-note contents, Hermes transcripts, credentials or personal paths.** Issues are public.
        Security problems go through private reporting instead: see [SECURITY.md](https://github.com/Al-ex-W/xCreen/blob/main/SECURITY.md).
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: What you did, what you expected, and what happened instead.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. ...
        2. ...
    validations:
      required: true
  - type: input
    id: macos
    attributes:
      label: macOS version
      description: "Apple menu → About This Mac, or `sw_vers -productVersion`."
      placeholder: "e.g. 26.1"
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: xCreen commit
      description: "`git rev-parse --short HEAD` in your checkout."
  - type: input
    id: hermes
    attributes:
      label: Hermes Agent version
      description: "`hermes --version`, if available."
  - type: textarea
    id: status
    attributes:
      label: "`xcreen --json status` output (redacted)"
      description: Replace vault paths, home-directory paths, session IDs and model/provider names you consider private with placeholders like `<redacted>`.
      render: json
  - type: textarea
    id: logs
    attributes:
      label: Relevant log lines (redacted)
      description: |
        From `xcreen logs --no-follow` (add `--gateway` for the Hermes runtime). Paste only the few lines around the error.
        Logs must not contain screen text, but check anyway: remove any OCR text, window titles, note contents, paths or identifiers before posting.
      render: text
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy check
      options:
        - label: I removed screenshots, OCR/screen text, note contents, credentials and personal paths from this report.
          required: true
